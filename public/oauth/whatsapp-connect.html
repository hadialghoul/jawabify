<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Connect WhatsApp — Jawabify</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        font-family: system-ui, -apple-system, sans-serif;
        color: #334155;
        background: #f8fafc;
        padding: 24px;
        text-align: center;
      }
      .spin {
        width: 28px;
        height: 28px;
        border: 3px solid #cbd5e1;
        border-top-color: #10b981;
        border-radius: 50%;
        animation: r 0.8s linear infinite;
      }
      @keyframes r {
        to {
          transform: rotate(360deg);
        }
      }
      .err {
        color: #dc2626;
        max-width: 28rem;
        font-size: 14px;
      }
      .msg {
        color: #64748b;
        font-size: 14px;
        max-width: 28rem;
      }
      a {
        color: #059669;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="spin" id="spin"></div>
    <p class="msg" id="msg">Preparing WhatsApp connection…</p>
    <p class="err" id="err" hidden></p>
    <a id="back" href="/oauth/whatsapp-done.html?error=Cancelled" hidden>Return to the app</a>

    <script>
      // Same Meta app + Embedded Signup config as the Jawabify website.
      var META_APP_ID = '1392579008772004';
      var META_CONFIG_ID = '1648388239943864';
      var SUPABASE_URL = 'https://qemxlbjwpxyljkansqsl.supabase.co';
      var SUPABASE_ANON_KEY =
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFlbXhsYmp3cHh5bGprYW5zcXNsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU5NTgwNzEsImV4cCI6MjA4MTUzNDA3MX0.YZ7bs6m2UvzM8WDx_ui2kPWHmValHIXLI6ProoSWOmA';
      var DONE = '/oauth/whatsapp-done.html';

      var msgEl = document.getElementById('msg');
      var errEl = document.getElementById('err');
      var spinEl = document.getElementById('spin');
      var backEl = document.getElementById('back');
      var signupData = null;

      function fail(text) {
        spinEl.hidden = true;
        msgEl.hidden = true;
        errEl.hidden = false;
        errEl.textContent = text;
        backEl.hidden = false;
        backEl.href = DONE + '?error=' + encodeURIComponent(text);
      }

      function finish(params) {
        var q = new URLSearchParams(params);
        window.location.replace(DONE + '?' + q.toString());
      }

      window.addEventListener('message', function (event) {
        if (!/facebook\.com$/.test(event.origin) && !/facebook\.net$/.test(event.origin)) return;
        try {
          var data = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
          if (!data || data.type !== 'WA_EMBEDDED_SIGNUP') return;
          if (data.event && String(data.event).indexOf('FINISH') === 0) signupData = data.data || null;
          if (data.event === 'CANCEL' && data.data && data.data.error_message) {
            fail(data.data.error_message);
          }
        } catch (e) {}
      });

      function waitSignup(cb) {
        var n = 0;
        (function tick() {
          if (signupData || n > 10) return cb(signupData);
          n += 1;
          setTimeout(tick, 200);
        })();
      }

      function startFbLogin(accessToken, tenantId, actingTenant) {
        msgEl.textContent = 'Opening Facebook to connect WhatsApp…';
        window.fbAsyncInit = function () {
          FB.init({ appId: META_APP_ID, cookie: true, xfbml: false, version: 'v21.0' });
          FB.login(
            function (response) {
              if (!response || !response.authResponse || !response.authResponse.code) {
                finish({ error: 'Facebook login was cancelled.' });
                return;
              }
              msgEl.textContent = 'Saving WhatsApp connection…';
              waitSignup(function (data) {
                var body = {
                  code: response.authResponse.code,
                  tenant_id: tenantId,
                  waba_id: (data && (data.waba_id || (data.waba_ids && data.waba_ids[0]))) || undefined,
                  phone_number_id: data && data.phone_number_id,
                  business_id: data && data.business_id,
                };
                var headers = {
                  'Content-Type': 'application/json',
                  apikey: SUPABASE_ANON_KEY,
                  Authorization: 'Bearer ' + accessToken,
                };
                if (actingTenant) headers['x-acting-tenant'] = actingTenant;

                fetch(SUPABASE_URL + '/functions/v1/meta-exchange-token', {
                  method: 'POST',
                  headers: headers,
                  body: JSON.stringify(body),
                })
                  .then(function (r) {
                    return r.json();
                  })
                  .then(function (json) {
                    if (!json || !json.success) {
                      finish({ error: (json && json.error) || 'Failed to complete WhatsApp connection' });
                      return;
                    }
                    finish({
                      ok: '1',
                      phone: json.phone_number || json.phone_number_id || '',
                      warning: json.warning || '',
                    });
                  })
                  .catch(function (e) {
                    finish({ error: e.message || 'Failed to reconnect WhatsApp' });
                  });
              });
            },
            {
              config_id: META_CONFIG_ID,
              response_type: 'code',
              override_default_response_type: true,
              auth_type: 'reauthenticate',
              extras: { setup: {}, featureType: '', sessionInfoVersion: '3' },
            },
          );
        };

        var s = document.createElement('script');
        s.src = 'https://connect.facebook.net/en_US/sdk.js';
        s.async = true;
        s.defer = true;
        s.onerror = function () {
          fail('Facebook SDK failed to load. Check your connection and try again.');
        };
        document.body.appendChild(s);
      }

      (function () {
        var hash = new URLSearchParams(window.location.hash.replace(/^#/, ''));
        var accessToken = hash.get('access_token');
        var tenantId = hash.get('tenant_id');
        var actingTenant = hash.get('acting_tenant');
        if (accessToken) {
          history.replaceState({}, '', window.location.pathname);
        }
        if (!accessToken || !tenantId) {
          fail('Your Jawabify session was missing. Go back to the app and try again.');
          return;
        }
        startFbLogin(accessToken, tenantId, actingTenant);
      })();
    </script>
  </body>
</html>
