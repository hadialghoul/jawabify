<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WhatsApp connected — Jawabify</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, sans-serif;
        background: #f8fafc;
        padding: 24px;
        text-align: center;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 8px;
        color: #0f172a;
      }
      p {
        margin: 0;
        font-size: 14px;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <div>
      <h1 id="title">Returning to Jawabify…</h1>
      <p id="sub">You can return to the app now.</p>
    </div>
    <script>
      (function () {
        var p = new URLSearchParams(window.location.search);
        var err = p.get('error');
        var ok = p.get('ok') === '1';
        var phone = p.get('phone');
        var title = document.getElementById('title');
        var sub = document.getElementById('sub');
        if (err) {
          title.textContent = 'WhatsApp connection did not finish';
          sub.textContent = err;
        } else if (ok) {
          title.textContent = 'WhatsApp connected';
          sub.textContent = phone ? 'Number: ' + phone : 'You can return to the app now.';
        }
      })();
    </script>
  </body>
</html>
