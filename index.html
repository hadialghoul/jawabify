<style>
  html, body { background-color: #FAFAF7; }
  @media (prefers-color-scheme: dark) {
    html, body { background-color: #0B1411; }
  }
  #root { min-height: 100dvh; }
  .jawabify-shell-hide #jawabify-lcp-shell { display: none !important; }

<style>
  #jawabify-lcp-shell {
    position: fixed;
    inset: 0;
    z-index: 60;
    background: #FAFAF7;
    color: #0a0a1a;
    font-family: 'Epilogue', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    transition: opacity 0.55s ease;
  }
  #jawabify-lcp-shell.jawabify-shell-fading {
    opacity: 0;
    pointer-events: none;
  }
  #jawabify-lcp-shell h1,
  #jawabify-lcp-shell h2 {
    font-family: 'Urbanist', system-ui, -apple-system, sans-serif;
    margin: 0;
  }
  .jawabify-shell-content {
    position: relative;
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 20px;
    height: 100%;
    display: flex;
    flex-direction: column;
  }
  .jawabify-shell-header {
    height: 64px;
    display: flex;
    align-items: center;
    flex-shrink: 0;
  }
  .jawabify-shell-header img {
    height: 36px;
    width: auto;
    border-radius: 6px;
  }
  .jawabify-shell-hero {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr;
    align-items: center;
    gap: 32px;
    padding: 32px 0 64px;
  }
  @media (min-width: 1024px) {
    .jawabify-shell-hero {
      grid-template-columns: 1.05fr 1fr;
      gap: 48px;
    }
  }
  .jawabify-shell-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border: 1px solid rgba(10, 10, 26, 0.12);
    background: rgba(255, 255, 255, 0.72);
    padding: 7px 14px;
    border-radius: 9999px;
    font-size: 12px;
    font-weight: 600;
    color: #3a3a4a;
    margin-bottom: 24px;
    width: fit-content;
  }
  .jawabify-shell-pulse {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #10b981;
  }
  .jawabify-shell-hero h1 {
    font-size: 36px;
    line-height: 1.04;
    font-weight: 800;
    letter-spacing: -0.025em;
    max-width: 12ch;
  }
  @media (min-width: 640px) {
    .jawabify-shell-hero h1 { font-size: 52px; }
  }
  @media (min-width: 1024px) {
    .jawabify-shell-hero h1 { font-size: 64px; }
  }
  .jawabify-shell-gradient {
    background: linear-gradient(135deg, #4f46e5 0%, #0a0a1a 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .jawabify-shell-hero p {
    font-size: 16px;
    line-height: 1.6;
    color: #3a3a4a;
    margin-top: 20px;
    max-width: 560px;
  }
  @media (min-width: 640px) {
    .jawabify-shell-hero p { font-size: 18px; }
  }
  .jawabify-shell-ctas {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 28px;
  }
  .jawabify-shell-ctas a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px 24px;
    border-radius: 9999px;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    transition: transform 0.15s ease;
  }
  .jawabify-shell-ctas a:hover { transform: translateY(-1px); }
  .jawabify-shell-ctas a:first-child {
    background: #0a0a1a;
    color: #fff;
  }
  .jawabify-shell-ctas a:last-child {
    background: #fff;
    color: #0a0a1a;
    border: 1px solid rgba(10, 10, 26, 0.12);
  }
  .jawabify-shell-right {
    display: none;
  }
  @media (min-width: 1024px) {
    .jawabify-shell-right { display: block; }
  }
  .jawabify-shell-visual {
    width: 100%;
    height: 420px;
    background: #fff;
    border: 1px solid rgba(10, 10, 26, 0.08);
    border-radius: 24px;
    box-shadow: 0 24px 60px -20px rgba(79, 70, 229, 0.28);
    position: relative;
    overflow: hidden;
  }
  .jawabify-shell-visual::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 70% 30%, rgba(79, 70, 229, 0.12) 0%, transparent 60%);
  }
  .jawabify-shell-visual::after {
    content: '';
    position: absolute;
    top: 24px;
    left: 24px;
    right: 24px;
    height: 48px;
    background: rgba(10, 10, 26, 0.04);
    border-radius: 12px;
  }
</style>

      window.addEventListener('load', function() {

        setTimeout(function() { shell.remove(); }, 650);
